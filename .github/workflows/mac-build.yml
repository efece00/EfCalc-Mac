
name: Build Mac App

on:
  workflow_dispatch:
  push:
    branches:
      - ana

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Mac DMG
        run: npm run dist:mac -- --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: EfCalc-Mac
          path: dist/*.dmg
          if-no-files-found: error
