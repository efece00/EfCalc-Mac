
name: Build and Publish Mac App

on:
  workflow_dispatch:
  push:
    branches:
      - ana

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Mac DMG
        run: npm run dist:mac -- --publish never

      - name: Publish Mac DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: EfCalc Mac v1.0.0
          files: dist/*.dmg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
